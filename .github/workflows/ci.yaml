name: Go Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod download
          go mod verify

      - name: Verify Module Consistency
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check Code Formatting
        run: |
          unformatted=$(find . -name "*.go" -not -path "*/vendor/*" -not -path "*/tmp_test/*" -print0 | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            echo "Please run 'gofmt -w .' on your local files."
            exit 1
          fi

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Validate OpenAPI Specification
        run: npx -y @redocly/cli lint docs/phase-1/openapi.yaml

      - name: Run Unit and Integration Tests
        run: |
          # Mock the required environment variables enforced by the discovery and logger libraries
          export SERVICE_NAME="mango-go-foundation-service"
          export SERVICE_TYPE="mango-go-foundation-service"
          export SERVICE_VERSION="dev"
          export SYSTEM_URI_PRIVATE="https://localhost:17010"
          export SYSTEM_URI_PUBLIC="https://localhost:16010"
          export DISCOVERY_TOPIC="service_events"
          
          go test -v -race ./...

      - name: Build Service Binary
        run: |
          make build
