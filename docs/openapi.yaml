openapi: 3.0.0
info:
  title: "{{SERVICE_NAME}} API"
  version: "1.0.0"
  description: "REST API definition for {{SERVICE_NAME}} microservice"
paths:
  /api/v1/items:
    get:
      summary: "List all items"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
    post:
      summary: "Create a new item"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: "Item successfully created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          description: "Invalid input"

  /api/v1/items/{id}:
    get:
      summary: "Get an item by ID"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "404":
          description: "Item not found"
    put:
      summary: "Update an existing item"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: "Item updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "404":
          description: "Item not found"
    delete:
      summary: "Delete an item"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "Item successfully deleted"
        "404":
          description: "Item not found"

components:
  schemas:
    SampleItem:
      type: "object"
      required:
        - "id"
        - "name"
        - "description"
        - "createdAt"
        - "updatedAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    CreateItemRequest:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
          minLength: 2
          maxLength: 255
        description:
          type: "string"
          maxLength: 1000
    UpdateItemRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 2
          maxLength: 255
        description:
          type: "string"
          maxLength: 1000
    ItemResponse:
      type: "object"
      properties:
        data:
          $ref: "#/components/schemas/SampleItem"
    ItemListResponse:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/SampleItem"
